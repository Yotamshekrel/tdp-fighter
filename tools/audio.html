<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Audio test (dev only)</title>
    <style>
      body { font: 13px/1.4 monospace; background: #14101e; color: #ddd; margin: 12px; }
      table { border-collapse: collapse; } td, th { padding: 2px 10px; text-align: left; }
      .bad { color: #f66; } .ok { color: #7d7; } button { margin: 2px; }
    </style>
  </head>
  <body>
    <h3>Sound effects (rendered offline: peak level, loudness, length)</h3>
    <div id="sfx"></div>
    <h3>Songs (first 12 bars rendered offline) - click a name to listen</h3>
    <div id="songs"></div>
    <script type="module">
      // Dev tool: renders every sound effect and song offline and reports its level, so a silent,
      // clipping or broken sound shows up. Click any button to hear it for real.
      import { SFX } from '../src/audio/sfx.js';
      import { SONGS, Sequencer } from '../src/audio/music.js';
      import { AudioEngine } from '../src/audio/audio.js';

      const SR = 44100;
      const stats = (buf) => {
        let peak = 0, sum = 0, last = 0;
        const n = buf.length;
        for (let ch = 0; ch < buf.numberOfChannels; ch++) {
          const d = buf.getChannelData(ch);
          for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; sum += d[i] * d[i]; if (a > 0.003 && i > last) last = i; }
        }
        return { peak, rms: Math.sqrt(sum / (n * buf.numberOfChannels)), len: last / SR };
      };
      const row = (name, s, extra = '') => {
        const bad = s.peak < 0.02 || s.peak > 1.0;
        return `<tr class="${bad ? 'bad' : 'ok'}"><td>${name}</td><td>${s.peak.toFixed(2)}</td><td>${(20 * Math.log10(s.rms || 1e-6)).toFixed(0)} dB</td><td>${s.len.toFixed(2)}s</td><td>${extra}</td></tr>`;
      };

      const engine = new AudioEngine();
      const play = (name) => { engine.unlock(); engine.play(name, { x: 240 }); };
      let html = '<table><tr><th>name</th><th>peak</th><th>rms</th><th>tail</th><th></th></tr>';
      for (const [name, fn] of Object.entries(SFX)) {
        const oc = new OfflineAudioContext(2, SR * 3, SR);
        try { fn(oc, oc.destination, 0); } catch (e) { html += `<tr class="bad"><td>${name}</td><td colspan=4>${e.message}</td></tr>`; continue; }
        const s = stats(await oc.startRendering());
        html += row(name, s, `<button data-sfx="${name}">play</button>`);
      }
      document.getElementById('sfx').innerHTML = html + '</table>';

      let sh = '<table><tr><th>song</th><th>peak</th><th>rms</th><th></th></tr>';
      for (const [name, song] of Object.entries(SONGS)) {
        const oc = new OfflineAudioContext(2, SR * 26, SR);
        const out = oc.createGain();
        out.connect(oc.destination);
        const q = new Sequencer(oc, out, song);
        q.out.gain.value = 1;
        const steps = 16 * 12;
        for (let i = 0; i < steps; i++) for (const tr of song.tracks) q.playStep(tr, i % tr.notes.length, i * q.stepDur);
        const s = stats(await oc.startRendering());
        sh += row(name, s, `<button data-song="${name}">play</button>`);
      }
      document.getElementById('songs').innerHTML = sh + '</table>';
      document.body.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        engine.unlock();
        if (b.dataset.sfx) play(b.dataset.sfx);
        if (b.dataset.song) engine.playMusic(b.dataset.song, true);
      });
      document.title = 'done';
    </script>
  </body>
</html>
