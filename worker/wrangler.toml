# Room-code signaling for online play, on Cloudflare Workers (see worker/index.js).
# Deploy:  cd worker && npx wrangler login && npx wrangler deploy
name = "tdp-fighter-rooms"
main = "index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
